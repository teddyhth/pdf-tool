# 推送 v* 標籤（例如 v1.0.0）時，自動打包 Windows exe 與 Mac App 並發布到 Releases。
# 也可以在 Actions 頁面手動執行（只產出 artifact，不發布）。
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PDFTool-Windows.exe
          - os: macos-latest
            asset: PDFTool-Mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Self-test (source)
        run: python main.py --selftest

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PDFTool main.py
          # 實際啟動打包好的 exe 做自我檢查，失敗就不發布
          $p = Start-Process dist/PDFTool.exe -ArgumentList "--selftest", "selftest.log" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
          Move-Item dist/PDFTool.exe dist/${{ matrix.asset }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name PDFTool --osx-bundle-identifier com.local.pdftool main.py
          # 實際啟動打包好的 App 做自我檢查，失敗就不發布
          dist/PDFTool.app/Contents/MacOS/PDFTool --selftest "$PWD/selftest.log" || { cat selftest.log; exit 1; }
          cat selftest.log
          ditto -c -k --keepParent dist/PDFTool.app dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Add browser version
        # GitHub 下載頁的檔名不支援中文，發布時改成英文檔名
        run: cp "PDF工具.html" assets/PDFTool.html
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
